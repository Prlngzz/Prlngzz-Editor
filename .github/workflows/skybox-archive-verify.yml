name: Verify skybox archive contents

on:
  push:
    branches: ["codex/**"]
    paths:
      - "SkyboxImages/SKyboxes.zip"
      - ".github/assets/sky-library-index.json"
      - ".github/workflows/skybox-archive-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Inspect all 65 original sky archives
        shell: bash
        run: |
          python3 - <<'PY'
          import io, json, zipfile, pathlib, subprocess, tempfile, os
          archive_path = pathlib.Path("SkyboxImages/SKyboxes.zip")
          if not archive_path.is_file() or archive_path.stat().st_size < 1_000_000:
              raise SystemExit(f"Git LFS did not restore the actual skybox archive: {archive_path} ({archive_path.stat().st_size if archive_path.exists() else 0} bytes)")
          index = json.loads(pathlib.Path(".github/assets/sky-library-index.json").read_text(encoding="utf-8"))
          manifest = []
          with zipfile.ZipFile(archive_path) as outer:
              entries = {name.replace("\\", "/").lstrip("./").casefold(): name for name in outer.namelist()}
              print(f"Outer archive: {archive_path.stat().st_size:,} bytes; {len(entries)} entries")
              for item in index["items"]:
                  requested = item["archive"].replace("\\", "/").lstrip("./").casefold()
                  actual = entries.get(requested)
                  if not actual:
                      base = pathlib.PurePosixPath(requested).name
                      actual = next((name for key, name in entries.items() if pathlib.PurePosixPath(key).name == base), None)
                  record = {"name": item["name"], "archive": item["archive"], "members": [], "error": None}
                  if not actual:
                      record["error"] = "archive missing from parent ZIP"
                  elif actual.lower().endswith(".zip"):
                      try:
                          with zipfile.ZipFile(io.BytesIO(outer.read(actual))) as inner:
                              record["members"] = [
                                  x.filename for x in inner.infolist()
                                  if not x.is_dir() and pathlib.PurePosixPath(x.filename).suffix.lower() in
                                     {".png", ".jpg", ".jpeg", ".webp", ".bmp", ".tga", ".dds"}
                              ]
                      except Exception as exc:
                          record["error"] = f"nested ZIP: {exc}"
                  elif actual.lower().endswith(".rar"):
                      with tempfile.NamedTemporaryFile(suffix=".rar", delete=False) as temp:
                          temp.write(outer.read(actual)); temp_path = temp.name
                      try:
                          listing = subprocess.run(["7z", "l", "-slt", temp_path], text=True, capture_output=True, check=True).stdout
                          for line in listing.splitlines():
                              if line.startswith("Path = "):
                                  name = line[7:].strip()
                                  if pathlib.PurePosixPath(name).suffix.lower() in {".png", ".jpg", ".jpeg", ".webp", ".bmp", ".tga", ".dds"}:
                                      record["members"].append(name)
                      except Exception as exc:
                          record["error"] = f"RAR listing: {exc}"
                      finally:
                          os.unlink(temp_path)
                  else:
                      record["error"] = f"unsupported archive type: {actual}"
                  manifest.append(record)
                  print(f"SKY|{item['name']}|{len(record['members'])} images|{record['error'] or '; '.join(record['members'])}")
          pathlib.Path("skybox-archive-manifest.json").write_text(json.dumps(manifest, indent=2), encoding="utf-8")
          if len(manifest) != 65:
              raise SystemExit(f"Expected 65 manifest records, got {len(manifest)}")
          missing = [x for x in manifest if x["error"] or not x["members"]]
          print(f"SUMMARY: {len(manifest) - len(missing)}/65 archives readable; {len(missing)} missing/unreadable")
          PY

      - name: Upload skybox archive manifest
        uses: actions/upload-artifact@v4
        with:
          name: skybox-archive-manifest
          path: skybox-archive-manifest.json
          if-no-files-found: error
          retention-days: 7
