name: Prlngzz Editor — Windows x64

on:
  push:
    branches: [development, "codex/**"]
    tags: ["editor-v*"]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prlngzz-editor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image conversion support
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow vtf2img

      - name: Materialize and extract original skybox faces
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Write-Host "LFS tracked objects:"
          git lfs ls-files --long
          if ($LASTEXITCODE -ne 0) { throw "git lfs ls-files failed" }
          Write-Host "Fetch the exact archive object from the checked-out branch"
          git lfs fetch --include="SkyboxImages/SKyboxes.zip" origin "refs/heads/$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { git lfs logs last; throw "Could not fetch Skyboxes.zip from Git LFS" }
          git lfs checkout SkyboxImages/SKyboxes.zip
          if ($LASTEXITCODE -ne 0) { git lfs logs last; throw "Could not materialize Skyboxes.zip from Git LFS" }
          $pointer = Get-Content (Join-Path $env:GITHUB_WORKSPACE "SkyboxImages/SKyboxes.zip") -Raw
          Write-Host "Archive file size: $((Get-Item (Join-Path $env:GITHUB_WORKSPACE "SkyboxImages/SKyboxes.zip")).Length)"
          if ($pointer.StartsWith("version https://git-lfs.github.com/spec/v1")) {
            git lfs logs last
            throw "Git LFS still left the pointer in the worktree. Tracked files: $(git lfs ls-files --long)"
          }
          $env:SKY_ASSET_BRANCH = "sky-library-cdn-assets"
          python .github/scripts/inspect_skyboxes.py
          if ($LASTEXITCODE -ne 0) { throw "Could not extract the original skybox faces" }


      - name: Publish collection sky faces to the dedicated CDN branch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $assetBranch = "sky-library-cdn-assets"
          $assetWorktree = Join-Path $env:RUNNER_TEMP "sky-cdn-assets"
          # Braces prevent PowerShell from treating the colon as part of a scoped variable name.
          git fetch origin "refs/heads/${assetBranch}:refs/remotes/origin/${assetBranch}"
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch the dedicated sky CDN branch" }
          try {
            git worktree add --detach $assetWorktree "refs/remotes/origin/$assetBranch"
            if ($LASTEXITCODE -ne 0) { throw "Could not prepare the sky CDN worktree" }
            $assetDirectory = Join-Path $assetWorktree ".github/assets"
            $destination = Join-Path $assetDirectory "sky-faces"
            if (Test-Path $destination) { Remove-Item -LiteralPath $destination -Recurse -Force }
            New-Item -ItemType Directory -Force -Path $assetDirectory | Out-Null
            Copy-Item -LiteralPath ".github/assets/sky-faces" -Destination $assetDirectory -Recurse -Force
            git -C $assetWorktree config user.name "github-actions[bot]"
            git -C $assetWorktree config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C $assetWorktree add --all .github/assets/sky-faces
            git -C $assetWorktree diff --cached --quiet
            if ($LASTEXITCODE -eq 1) {
              git -C $assetWorktree commit -m "Update collection sky face CDN assets"
              if ($LASTEXITCODE -ne 0) { throw "Could not commit extracted sky faces" }
              git -C $assetWorktree push origin "HEAD:refs/heads/${assetBranch}"
              if ($LASTEXITCODE -ne 0) { throw "Could not publish extracted sky faces to the CDN branch" }
            } elseif ($LASTEXITCODE -ne 0) {
              throw "Could not inspect changes to the sky CDN assets"
            }
          } finally {
            if (Test-Path $assetWorktree) {
              git worktree remove --force $assetWorktree
              if ($LASTEXITCODE -ne 0) { Write-Warning "Could not remove temporary CDN worktree at $assetWorktree" }
            }
          }

      - name: Upload original skybox face manifest
        uses: actions/upload-artifact@v4
        with:
          name: skybox-face-manifest
          path: |
            skybox-archive-manifest.json
            skybox-outer-entries.txt
            .github/assets/sky-face-map.json
          if-no-files-found: error
          retention-days: 7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt

      - name: Restore and patch source archive
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:GITHUB_WORKSPACE "Prlngzz-Editor-source.zip"
          if (!(Test-Path $archive)) { throw "Upload Prlngzz-Editor-source.zip to the repository root." }
          $destination = Join-Path $env:RUNNER_TEMP "prlngzz-editor-source"
          if (Test-Path $destination) { Remove-Item $destination -Recurse -Force }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force
          $project = Join-Path $destination "Prlngzz-Editor"
          if (!(Test-Path (Join-Path $project "Cargo.toml"))) { throw "The archive did not contain Prlngzz-Editor/Cargo.toml" }

          # Fix the local replacement helpers before the dedicated formatting check.
          Write-Host "Source repair: begin"
          $guiFile = Join-Path $project "src/gui.rs"
          Write-Host "Source repair: GUI file opened"
          $guiSource = [IO.File]::ReadAllText($guiFile)
          $guiSource = [regex]::Replace(
            $guiSource,
            'ui\.with_layout\(egui::Layout::right_to_left\(egui::Align::Center\),\s*\|ui\|\s*\{\s*\}\);',
            ''
          )
          [IO.File]::WriteAllText($guiFile, $guiSource, [Text.UTF8Encoding]::new($false))
          Write-Host "Source repair: GUI file written"

          Write-Host "Source repair: invoking project source patches"
          & (Join-Path $env:GITHUB_WORKSPACE ".github/patches/apply-source-patches.ps1") -Project $project

          Push-Location $project
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { throw "cargo fmt failed after source patching" }
          Pop-Location

          Write-Host "Source repair: complete"
          if (!(Test-Path (Join-Path $project "src/gui.rs")) -or !(Test-Path (Join-Path $project "src/config.rs"))) { throw "Source repair did not leave the required Rust files in place" }
          $global:LASTEXITCODE = 0

      - name: Inspect config compatibility and navigation source
        shell: pwsh
        run: |
          $project = Join-Path $env:RUNNER_TEMP "prlngzz-editor-source\\Prlngzz-Editor"
          Write-Output "===== PROJECT FILES ====="
          Get-ChildItem $project -Force | Select-Object Name,Length,Mode | Format-Table -AutoSize | Out-String | Write-Output
          $guiPath = Join-Path $project "src/gui.rs"
          $gui = Get-Content $guiPath
          Write-Output "===== GUI NAVIGATION / SETTINGS / STUDIO ====="
          Select-String -Path $guiPath -Pattern 'enum Tab|enum Action|Tab::Studio|Tab::Settings|fn .*settings|fn .*studio|Config Studio|Config Manager|Config Manager|sidebar|navigation' -Context 2,6 | ForEach-Object { $_.ToString(); $_.Context.PreContext; $_.Context.PostContext }
          Write-Output "===== STUDIO PARSER ====="
          Get-Content (Join-Path $project "src/studio.rs") | ForEach-Object { $_ }
          Write-Output "===== CONFIG ENGINE MATCHES ====="
          Select-String -Path (Join-Path $project "src/config.rs") -Pattern 'enum Action|struct Rule|enum Selector|fn resolve|fn apply|fn plan|local_file|asset_id|remove|remove_asset|action.get|targets' -Context 2,8 | ForEach-Object { $_.ToString(); $_.Context.PreContext; $_.Context.PostContext }
          Write-Output "===== SKIN / NO-HANDS FILES ====="
          Get-ChildItem $project -Recurse -File -Include *.json,*.toml,*.md | Select-String -Pattern 'no.?hands|skinchanger|skin.?changer|handless|hands' -CaseSensitive:$false | ForEach-Object { "$($_.Path):$($_.LineNumber): $($_.Line)" }

      - name: Package restored source snapshot for feature update
        shell: pwsh
        run: |
          $project = Join-Path $env:RUNNER_TEMP "prlngzz-editor-source\\Prlngzz-Editor"
          $snapshot = Join-Path $env:RUNNER_TEMP "Prlngzz-Editor-source-snapshot.zip"
          $paths = @(
            (Join-Path $project "src"),
            (Join-Path $project "assets"),
            (Join-Path $project "Cargo.toml"),
            (Join-Path $project "Cargo.lock"),
            (Join-Path $project "changelog.json"),
            (Join-Path $project "rivals_asset_catalog.json"),
            (Join-Path $project "rivals_asset_ids.json"),
            (Join-Path $project "sky_profiles"),
            (Join-Path $project "texture_profiles")
          )
          Compress-Archive -Path $paths -DestinationPath $snapshot -Force
          if (!(Test-Path $snapshot)) { throw "Source snapshot was not created" }

      - name: Upload restored source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: Prlngzz-Editor-source-snapshot
          path: ${{ runner.temp }}/Prlngzz-Editor-source-snapshot.zip
          if-no-files-found: error
          retention-days: 7

      - name: Check formatting
        shell: pwsh
        run: |
          $project = Join-Path $env:RUNNER_TEMP "prlngzz-editor-source\Prlngzz-Editor"
          Push-Location $project
          cargo fmt --all -- --check
          if ($LASTEXITCODE -ne 0) { throw "cargo fmt check failed" }
          Pop-Location

      - name: Run tests
        shell: pwsh
        run: |
          $project = Join-Path $env:RUNNER_TEMP "prlngzz-editor-source\Prlngzz-Editor"
          Push-Location $project
          cargo test --release --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "cargo test failed" }
          Pop-Location

      - name: Run Clippy
        shell: pwsh
        run: |
          $project = Join-Path $env:RUNNER_TEMP "prlngzz-editor-source\Prlngzz-Editor"
          Push-Location $project
          cargo clippy --all-targets --locked --target x86_64-pc-windows-msvc -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw "cargo clippy failed" }
          Pop-Location

      - name: Build Windows x64
        shell: pwsh
        run: |
          $project = Join-Path $env:RUNNER_TEMP "prlngzz-editor-source\Prlngzz-Editor"
          Push-Location $project
          cargo build --release --locked --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed" }
          Pop-Location

      - name: Verify executable and prepare artifact
        shell: pwsh
        run: |
          $project = Join-Path $env:RUNNER_TEMP "prlngzz-editor-source\Prlngzz-Editor"
          $binary = Join-Path $project "target/x86_64-pc-windows-msvc/release/prlngzz-editor.exe"
          if (!(Test-Path $binary)) { throw "Expected executable not found: $binary" }
          $versionOutput = & $binary --version
          if ($LASTEXITCODE -ne 0) { throw "Executable --version invocation failed" }
          if ($versionOutput.Trim() -ne "prlngzz-editor 0.3.19") { throw "Unexpected version: $versionOutput" }
          $versionInfo = (Get-Item $binary).VersionInfo
          if ($versionInfo.FileVersion -ne "0.3.19" -or $versionInfo.ProductVersion -ne "0.3.19") { throw "Unexpected Windows version metadata: file=$($versionInfo.FileVersion), product=$($versionInfo.ProductVersion)" }
          $bytes = [IO.File]::ReadAllBytes($binary)
          if ($bytes.Length -lt 256 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) { throw "Invalid PE file" }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ($bytes[$peOffset] -ne 0x50 -or $bytes[$peOffset + 1] -ne 0x45) { throw "Missing PE signature" }
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
          if ($machine -ne 0x8664) { throw "Expected AMD64 PE; found 0x$('{0:X4}' -f $machine)" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $binary "dist/Prlngzz-Editor-v0.3.19-Windows-x64.exe" -Force


      - name: Upload Windows x64 executable
        uses: actions/upload-artifact@v4
        with:
          name: Prlngzz-Editor-v0.3.19-Windows-x64
          path: dist/Prlngzz-Editor-v0.3.19-Windows-x64.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/editor-v') || github.ref == 'refs/heads/codex/sky-library-gallery-functional-v031'
        uses: softprops/action-gh-release@v2
        with:
          name: Prlngzz Editor v0.3.19
          tag_name: editor-v0.3.19
          target_commitish: ${{ github.sha }}
          make_latest: true
          generate_release_notes: true
          files: dist/Prlngzz-Editor-v0.3.19-Windows-x64.exe
